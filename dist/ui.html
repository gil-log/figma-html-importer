 .15s}.textarea-wrap.dragging .textarea{border-color:var(--figma-color-border-selected, #0d99ff);border-style:dashed}.textarea:focus{border-color:var(--figma-color-border-selected, #0d99ff)}.textarea:disabled{opacity:.6}.textarea::placeholder{color:var(--figma-color-text-tertiary, #aaa);line-height:1.8}.clear-btn{position:absolute;top:6px;right:6px;width:18px;height:18px;display:flex;align-items:center;justify-content:center;border:none;background:var(--figma-color-bg-tertiary, #e8e8e8);color:var(--figma-color-text-secondary, #666);border-radius:50%;font-size:9px;cursor:pointer;line-height:1}.clear-btn:hover{background:var(--figma-color-bg-danger-tertiary, #ffdddd);color:#e53e3e}.status-row{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--figma-color-bg-brand-tertiary, #e8f4ff);border-radius:5px;font-size:11px;color:var(--figma-color-text-brand, #0d99ff)}.spinner{width:12px;height:12px;border:2px solid rgba(13,153,255,.25);border-top-color:#0d99ff;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}@keyframes spin{to{transform:rotate(360deg)}}.status-text{font-weight:500}.error-box{padding:8px 10px;background:#fff0f0;border:1px solid #fca5a5;border-radius:5px;font-size:11px;color:#dc2626;line-height:1.5}.warning-box{padding:8px 10px;background:#fffbeb;border:1px solid #fcd34d;border-radius:5px;font-size:11px;color:#b45309;line-height:1.5;word-break:break-all}.success-box{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:#f0fdf4;border:1px solid #86efac;border-radius:5px;font-size:11px;color:#16a34a;font-weight:500}.result-detail{font-weight:400;color:#4ade80;font-size:10px}.import-btn{padding:9px 16px;background:#0d99ff;color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s,opacity .15s;letter-spacing:.01em}.import-btn:hover:not(.disabled){background:#08e}.import-btn.disabled{opacity:.45;cursor:not-allowed}.hint{font-size:10px;color:var(--figma-color-text-tertiary, #aaa);line-height:1.5;padding-bottom:2px}

          msg + '\nLine: ' + line + ':' + col +
          '\n' + (err && err.stack ? err.stack : '') + '</pre>';
      };
