<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { brand: '#EA27C2' } } } }</script>
</head>
<body class="bg-gray-50 font-sans">
  <header class="sticky top-0 flex items-center justify-between h-14 px-4 bg-white border-b border-gray-200">
    <h1 class="text-lg font-bold text-gray-900">샌디 오피스</h1>
    <button class="w-9 h-9 flex items-center justify-center rounded-full bg-gray-100">
      <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2c0 .5-.2 1-.6 1.4L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
    </button>
  </header>
  <main class="p-4 space-y-4 pb-24">
    <section class="rounded-2xl p-5 text-white bg-gradient-to-br from-brand to-purple-600 shadow-lg">
      <p class="text-xs uppercase tracking-widest opacity-80">Today</p>
      <p class="mt-1 text-2xl font-extrabold">회의실 예약 3건</p>
      <p class="mt-2 text-sm text-white/80">오늘 오후 2시에 <strong class="font-bold text-white">디자인 리뷰</strong>가 있습니다.</p>
    </section>
    <div class="grid grid-cols-2 gap-3">
      <div class="rounded-xl bg-white p-4 shadow-sm ring-1 ring-gray-100">
        <span class="inline-flex items-center rounded-full bg-green-100 px-2 py-0.5 text-xs font-medium text-green-700">사용 가능</span>
        <p class="mt-3 font-semibold text-gray-900 truncate">대회의실 A (12인 이상 대형)</p>
        <p class="text-sm text-gray-500">3층 · 12인</p>
      </div>
      <div class="rounded-xl bg-white p-4 shadow-sm ring-1 ring-gray-100">
        <span class="inline-flex items-center rounded-full bg-red-100 px-2 py-0.5 text-xs font-medium text-red-700">사용 중</span>
        <p class="mt-3 font-semibold text-gray-900">소회의실 B</p>
        <p class="text-sm text-gray-500">5층 · 4인</p>
      </div>
    </div>
    <div class="rounded-xl bg-white p-4 text-center">
      <p class="text-gray-700 leading-6">예약 내역이 없는 날에는 이곳에 추천 공간이 표시됩니다. 자주 쓰는 공간을 즐겨찾기 해 보세요.</p>
      <a href="#" class="mt-3 inline-block text-brand font-semibold underline">공간 둘러보기</a>
    </div>
    <label class="block">
      <span class="text-sm text-gray-600">검색</span>
      <input class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2" placeholder="공간 이름을 입력하세요">
    </label>
  </main>
  <nav class="fixed bottom-0 inset-x-0 h-16 bg-white border-t flex justify-around items-center">
    <a class="flex flex-col items-center text-xs text-brand"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9v9H3z"/></svg>홈</a>
    <a class="flex flex-col items-center text-xs text-gray-400"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg>예약</a>
    <a class="flex flex-col items-center text-xs text-gray-400"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16"/></svg>MY</a>
  </nav>
</body>
</html>
